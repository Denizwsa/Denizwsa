<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d31"/>
      <stop offset="1" stop-color="#232428"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f74c00"/>
      <stop offset="1" stop-color="#dea584"/>
    </linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5865f2"/>
      <stop offset="1" stop-color="#8b97ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#card)" stroke="#1e1f22" stroke-width="2"/>

  <!-- left: identity + tiles -->
  <text x="48" y="62" font-family="DejaVu Sans Mono, monospace" font-size="34" font-weight="bold" fill="#f2f3f5">DENIZWSA</text>
  <text x="48" y="88" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#94a3b4">rust · native apps · arch / omarchy · live numbers</text>

  <!-- tiles -->
  <g font-family="DejaVu Sans Mono, monospace">
    <rect x="48"  y="110" width="128" height="72" rx="10" fill="#1e1f22" stroke="#5865f2" stroke-opacity="0.35"/>
    <text x="112" y="145" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
    <text x="112" y="166" font-size="10" fill="#94a3b4" text-anchor="middle" letter-spacing="1">REPOS</text>

    <rect x="192" y="110" width="128" height="72" rx="10" fill="#1e1f22" stroke="#5865f2" stroke-opacity="0.35"/>
    <text x="256" y="145" font-size="25" font-weight="bold" fill="#ffd166" text-anchor="middle">6</text>
    <text x="256" y="166" font-size="10" fill="#94a3b4" text-anchor="middle" letter-spacing="1">STARS</text>

    <rect x="336" y="110" width="128" height="72" rx="10" fill="#1e1f22" stroke="#5865f2" stroke-opacity="0.35"/>
    <text x="400" y="145" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">66</text>
    <text x="400" y="166" font-size="10" fill="#94a3b4" text-anchor="middle" letter-spacing="1">COMMITS</text>

    <rect x="480" y="110" width="128" height="72" rx="10" fill="#1e1f22" stroke="#5865f2" stroke-opacity="0.35"/>
    <text x="544" y="145" font-size="25" font-weight="bold" fill="#57f287" text-anchor="middle">79</text>
    <text x="544" y="166" font-size="10" fill="#94a3b4" text-anchor="middle" letter-spacing="1">CONTRIBS</text>
  </g>

  <text x="48" y="224" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#4b5563">* last year via GitHub API · public repos only</text>

  <line x1="650" y1="40" x2="650" y2="260" stroke="#1e1f22" stroke-width="2"/>

  <!-- right: languages -->
  <text x="700" y="62" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#94a3b4" letter-spacing="2">LANGUAGES</text>

  <g font-family="DejaVu Sans Mono, monospace" font-size="13">
    <text x="700" y="104" fill="#f2f3f5">TypeScript</text><text x="1145" y="104" fill="#f2f3f5" text-anchor="end">57%</text>
    <rect x="700" y="112" width="445" height="8" rx="4" fill="#1e1f22"/>
    <rect x="700" y="112" width="254" height="8" rx="4" fill="url(#bl)"/>

    <text x="700" y="148" fill="#f2f3f5">Kotlin</text><text x="1145" y="148" fill="#f2f3f5" text-anchor="end">16%</text>
    <rect x="700" y="156" width="445" height="8" rx="4" fill="#1e1f22"/>
    <rect x="700" y="156" width="71" height="8" rx="4" fill="#7f52ff"/>

    <text x="700" y="192" fill="#f2f3f5">JavaScript</text><text x="1145" y="192" fill="#f2f3f5" text-anchor="end">13%</text>
    <rect x="700" y="200" width="445" height="8" rx="4" fill="#1e1f22"/>
    <rect x="700" y="200" width="58" height="8" rx="4" fill="#f7df1e"/>

    <text x="700" y="236" fill="#f2f3f5">Java</text><text x="1145" y="236" fill="#f2f3f5" text-anchor="end">9%</text>
    <rect x="700" y="244" width="445" height="8" rx="4" fill="#1e1f22"/>
    <rect x="700" y="244" width="40" height="8" rx="4" fill="#ed8b00"/>
  </g>
</svg>
